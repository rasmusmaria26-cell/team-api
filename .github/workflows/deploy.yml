name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest
        run: pytest -v

      - name: Build Docker image
        run: docker build -t team-api .

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Inject Commit SHA into version.txt
        run: echo "${{ github.sha }}" > app/version.txt

      - name: Deploy to Railway
        run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  smoke-test:
    name: Live Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify Live Application Health
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          TARGET_URL="${{ vars.APP_URL }}/health"
          echo "Polling target URL: $TARGET_URL"
          echo "Expected commit SHA: $EXPECTED_SHA"

          MAX_ATTEMPTS=30
          SLEEP_INTERVAL=6

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            echo "Attempt $i/$MAX_ATTEMPTS: Checking $TARGET_URL..."
            RESPONSE=$(curl -s -f "$TARGET_URL" || true)

            if [ -n "$RESPONSE" ]; then
              echo "Received response: $RESPONSE"
              STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
              VERSION=$(echo "$RESPONSE" | grep -o '"version":"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$STATUS" = "ok" ] && [ "$VERSION" = "$EXPECTED_SHA" ]; then
                echo "✅ Smoke test passed! Live service is healthy and running commit $EXPECTED_SHA."
                exit 0
              fi
            fi

            sleep $SLEEP_INTERVAL
          done

          echo "❌ Smoke test timed out waiting for deployment to become healthy."
          exit 1
